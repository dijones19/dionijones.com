<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dion I. Jones</title>
<meta http-equiv="refresh" content="3;url=https://www.linkedin.com/in/jonesdion">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
  }

  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }

  .glow {
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(185,155,100,0.08) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .card {
    position: relative;
    text-align: center;
    padding: 3rem 2.5rem;
    max-width: 460px;
    width: 90%;
    border: 0.5px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(8px);
    animation: fadeUp 0.8s ease both;
  }

  .monogram {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 1px solid rgba(185,155,100,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.5rem;
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    color: #b99b64;
    letter-spacing: 0.05em;
  }

  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    color: #f0ece4;
    letter-spacing: 0.01em;
    margin-bottom: 0.35rem;
    font-weight: 400;
  }

  .title {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 2rem;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: rgba(185,155,100,0.4);
    margin: 0 auto 2rem;
  }

  .redirect-msg {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.35);
    margin-bottom: 1.75rem;
    line-height: 1.6;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0.7rem 1.6rem;
    border: 1px solid rgba(185,155,100,0.5);
    border-radius: 6px;
    background: transparent;
    color: #b99b64;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }

  .btn:hover {
    background: rgba(185,155,100,0.1);
    color: #d4b87a;
  }

  .btn svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .progress-bar {
    margin-top: 2rem;
    height: 1px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: rgba(185,155,100,0.5);
    width: 0%;
    animation: progress 3s linear forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes progress {
    from { width: 0%; }
    to   { width: 100%; }
  }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="glow"></div>
<div class="card">
  <div class="monogram">DJ</div>
  <h1>Dion I. Jones</h1>
  <p class="title">Technology &amp; Innovation</p>
  <div class="divider"></div>
  <p class="redirect-msg">Redirecting you to LinkedIn&hellip;</p>
  <a class="btn" href="https://www.linkedin.com/in/jonesdion">
    <span>View Profile</span>
    <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
  </a>
  <div class="progress-bar"><div class="progress-fill"></div></div>
</div>
<script>
  setTimeout(() => {
    window.location.href = 'https://www.linkedin.com/in/jonesdion';
  }, 3000);
</script>
</body>
</html>
